# The one line per game (DECISIONS D-075, D-078) and the player lines (D-105). Twice a day:
# refresh this season's results and lines (ESPN, nflverse; free), compute each upcoming
# game's strongest fact-checked angle for the NFL, college football and the NBA and store it
# through ingest-game-lines, then each NFL and NBA game's verified player facts against its
# DraftKings props through ingest-player-lines, where Claude Haiku picks and polishes the one
# line a game shows (D-106, about half a cent a run). No stored secret here (GitHub OIDC auth).
name: Game lines

on:
  schedule:
    # 9:23 AM and 3:23 PM Eastern (UTC times; off the hour so GitHub doesn't delay them).
    # The afternoon run picks up NBA lines posted after the morning. GitHub treats schedules as
    # best effort and skipped both runs on Nov 25, so two backups follow each (D-121); a run
    # with nothing new rewrites the same lines.
    - cron: "23 14 * * *"
    - cron: "53 16 * * *"
    - cron: "23 20 * * *"
    - cron: "53 22 * * *"
  # A merged change to the engines, their data or this file refreshes the lines right away (D-121)
  push:
    branches: [main]
    paths:
      - "scripts/angles/**"
      - "data/history/**"
      - ".github/workflows/game-lines.yml"
      - "supabase/functions/_shared/player-lines*.ts"
      - "supabase/functions/_shared/player-judge.ts"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: game-lines
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore the ESPN response cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/espn-history
          key: espn-history-${{ github.run_id }}
          restore-keys: espn-history-
      - name: Restore nflverse player history (completed seasons)
        uses: actions/cache@v4
        with:
          path: nflverse
          key: nflverse-players-v1-${{ github.run_id }}
          restore-keys: nflverse-players-v1-
      - name: nflverse games and player files
        run: |
          mkdir -p nflverse
          curl -sSfL -o games.csv https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv
          cp games.csv nflverse/games.csv
          R=https://github.com/nflverse/nflverse-data/releases/download
          curl -sSfL -o nflverse/players.csv $R/players/players.csv
          M=$(date -u +%m); Y=$(date -u +%Y)
          if [ "$M" -le 6 ]; then NFL=$((Y-1)); else NFL=$Y; fi
          # Weekly stats, snap counts and PFR blitz counts since 2018 (D-105, D-106). Completed seasons come
          # from the cache when it has them; this season is fetched fresh every run.
          for s in $(seq 2018 "$NFL"); do
            for f in stats_player/stats_player_week_$s snap_counts/snap_counts_$s pfr_advstats/advstats_week_pass_$s; do
              out="nflverse/$(basename "$f").csv"
              if [ "$s" -lt "$NFL" ] && [ -s "$out" ]; then continue; fi
              curl -sSfL --retry 3 -o "$out" "$R/$f.csv"
            done
          done
      - name: Engine self-test
        run: python -I scripts/angles/player_angles.py --self-test
      - name: Compute and store the lines
        env:
          # Men's college basketball (D-116) runs only when the repo variable ENABLE_NCAAB is "true"
          ENABLE_NCAAB: ${{ vars.ENABLE_NCAAB }}
        run: |
          # College football and NFL seasons are named by their start year, the NBA and college basketball by their end year.
          M=$(date -u +%m); Y=$(date -u +%Y)
          if [ "$M" -le 6 ]; then CFB=$((Y-1)); else CFB=$Y; fi
          if [ "$M" -ge 8 ]; then NBA=$((Y+1)); else NBA=$Y; fi
          NCAAB=""
          if [ "$ENABLE_NCAAB" = "true" ]; then NCAAB="--ncaab --cbb-season $NBA"; fi
          python -I scripts/angles/run_daily.py --nflverse games.csv --cfb-season "$CFB" --nba-season "$NBA" \
            --ingest-url https://vwezujtftfccamoduglp.supabase.co/functions/v1/ingest-game-lines \
            --nflverse-dir nflverse \
            --player-ingest-url https://vwezujtftfccamoduglp.supabase.co/functions/v1/ingest-player-lines $NCAAB
