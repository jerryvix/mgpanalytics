# Takes (DECISIONS D-062): free transcription of the Takes shows' newest pick
# episodes with open-source Whisper. Proof run on push to the working branch;
# a nightly schedule is added once the pipeline is wired to Supabase.
name: Takes transcribe

on:
  workflow_dispatch:
    inputs:
      per_show:
        description: Episodes per show
        default: "1"
  push:
    branches: [claude/exciting-euler-w6d8uw]
    paths:
      - .github/workflows/takes-transcribe.yml
      - scripts/takes/**

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - run: pip install "faster-whisper>=1.1,<2"
      - run: python scripts/takes/transcribe.py --per-show "${{ github.event.inputs.per_show || '1' }}" --out takes-out
      - uses: actions/upload-artifact@v4
        with:
          name: takes-transcripts
          path: takes-out
          retention-days: 7
