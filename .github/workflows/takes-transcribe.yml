# Takes (DECISIONS D-062, D-074): the daily job behind the Takes page.
# Twice a day it transcribes every podcast episode the shows posted in the last 3 days
# that hasn't been processed yet, with open-source Whisper (free on GitHub's runners),
# then posts each transcript to the ingest-takes edge function, which pulls the picks
# out with Claude Haiku 5.5 and stores them for the site. Episodes already processed are
# skipped, so most runs take a few minutes. Text-only YouTube shows (Daft Previews) go
# first: only each new video's title and description, never audio or captions.
# Auth is GitHub's OIDC token (id-token: write); there is no stored secret.
name: Takes transcribe

on:
  schedule:
    # 12:17 PM and 5:47 PM Eastern (UTC times; off the hour so GitHub doesn't delay
    # them). Morning shows post by late morning, game-day episodes by mid-afternoon.
    - cron: "17 17 * * *"
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: Most new episodes to transcribe per show (every unprocessed one from the last 3 days, newest first)
        default: "6"

permissions:
  contents: read
  id-token: write

concurrency:
  group: takes-transcribe
  cancel-in-progress: false

env:
  INGEST_URL: https://vwezujtftfccamoduglp.supabase.co/functions/v1/ingest-takes

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Titles and descriptions only, from YouTube's public channel feed (standard library, no Whisper)
      - name: New videos from text-only YouTube shows
        continue-on-error: true
        run: python scripts/takes/youtube_text.py --ingest-url "$INGEST_URL"
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - run: pip install "faster-whisper>=1.1,<2"
      # Every unprocessed episode from the last 3 days, NBA ones included, so the separate
      # "newest NBA episode" step is no longer needed (a show posting more than two
      # episodes between runs used to lose the older ones)
      - name: New episodes from every show
        run: python scripts/takes/transcribe.py --max-new "${{ github.event.inputs.max_new || '6' }}" --any-title --ingest-url "$INGEST_URL" --out takes-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takes-transcripts
          path: takes-out
          if-no-files-found: ignore
          retention-days: 7
